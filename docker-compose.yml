services:
  # Node.js API application
  api:
    build: ./api
    # Removed explicit container_name to allow multiple replicas
    # Removed host port mapping (3000:3000) so traffic only flows through Traefik
    expose:
      - "3000"
    deploy:
      replicas: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Redis cache service - используем Debian-based образ для совместимости с Windows
  redis:
    image: "redis:7-bullseye" # Изменили на Debian-based образ
    container_name: redis_cache
    platform: linux/amd64 # Явно указываем архитектуру
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Reverse Proxy / Load Balancer
  traefik:
    image: "traefik:v2.10"
    container_name: traefik_proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80" # Public HTTP port
      - "8080:8080" # Traefik Dashboard (development only)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - app-network
    depends_on:
      - api
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
