name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Permissions are set to allow writing packages (for Docker Hub push)
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- Dockerfile Path Check ---
    # This step verifies the Dockerfile exists and sets the path as an output variable.
    - name: Check for Dockerfile existence
      id: check_file
      run: |
        DOCKERFILE_PATH="./api/Dockerfile"
        if [ -f "$DOCKERFILE_PATH" ]; then
          echo "DOCKERFILE_PATH=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
        else
          echo "Error: Dockerfile not found at $DOCKERFILE_PATH"
          echo "Please ensure your Dockerfile is at the correct path or update the DOCKERFILE_PATH variable."
          exit 1
        fi

    # Set up Node.js environment for running API tests
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Install API dependencies and run unit tests (if any)
    - name: Install API dependencies and run unit tests
      run: |
        # Note: This step is for running tests on the host runner, not inside the container.
        # It assumes your package.json is in the 'api' directory.
        cd api
        npm install
        npm test

    # ------------------------------------------------------------------
    # Docker Build and Push to Docker Hub
    # ------------------------------------------------------------------
    
    # Step 1: Log in to Docker Hub using secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }} # Use a Personal Access Token (PAT)

    # Step 2: Build and push the Docker image
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./api # <--- CRITICAL FIX: Set context to the 'api' folder
        push: true
        # Tag the image using your Docker Hub username
        tags: dxrklxrd/docker-multi-container-demo:latest
        # The 'file' path is relative to the repository root
        file: ./api/Dockerfile 

    # ------------------------------------------------------------------
    # Integration Tests (Optional but Recommended)
    # ------------------------------------------------------------------
    
    - name: Run integration tests (using docker compose)
      run: |
        # Start services in detached mode
        docker compose up -d
        
        # Wait for services to be ready (adjust sleep time if needed)
        echo "Waiting 10 seconds for services to start..."
        sleep 10 
        
        # Check API health endpoint (replace with your actual health check command)
        echo "Checking API health..."
        curl -f http://localhost:3000/health
        
        # Stop and clean up services
        echo "Stopping services..."
        docker compose down
